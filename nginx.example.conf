server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # No external resources are needed, so lock the page down. script-src 'self'
    # is the directive that stops an injected script from reading a seed phrase.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # A miner with hundreds of UTXOs produces a very large signed transaction.
    # The default 1m would reject valid spends, and the error would blame the
    # wrong thing. See cashier/README.md.
    location /api/bc3/wallet/ {
        client_max_body_size 2m;
        proxy_pass http://cashier:3010;
        proxy_set_header Host $host;
    }
}
